x-arcane:
  updater:
    strategy: auto

services:
  es01:
    container_name: ragflow-es-01
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - /second_disk/docker_data/ragflow/elastic_data:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    env_file:
      - .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
      - http.cors.enabled=true
      - http.cors.allow-credentials=true
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - http.max_content_length=900mb
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    mem_limit: ${MEM_LIMIT}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
        reservations:
          memory: 4G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow_langfuse
    restart: unless-stopped

  mysql:
    image: mysql:8.4.13
    container_name: ragflow-mysql
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TIMEZONE}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --mysql-native-password=ON
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - /second_disk/docker_data/ragflow/mysql_data:/var/lib/mysql
      - /second_disk/docker_data/ragflow/init.sql:/data/application/init.sql
    networks:
      - ragflow_langfuse
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    container_name: ragflow-minio
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
      - 9090:9000
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - /second_disk/docker_data/ragflow/minio_data:/data
    networks:
      - ragflow_langfuse
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k http://localhost:9000/minio/health/live"] #  -f
      interval: 30s
      timeout: 40s
      retries: 3

  redis:
    image: valkey/valkey:8
    container_name: ragflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    env_file:
      - .env
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - /second_disk/docker_data/ragflow/redis_data:/data
    networks:
      - ragflow_langfuse
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  ragflow-chat:
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragflow-chat
    entrypoint: ["/ragflow/entrypoint.sh", "--disable-taskexecutor"]
    ports:
      - ${SVR_HTTP_PORT}:9380
      - 80:80
      - 443:443
    volumes:
      - /second_disk/docker_data/ragflow/ragflow-logs/chat:/ragflow/logs
      - /second_disk/docker_data/ragflow/nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - /second_disk/docker_data/ragflow/nginx/proxy.conf:/etc/nginx/proxy.conf
      - /second_disk/docker_data/ragflow/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /second_disk/docker_data/ragflow/ragflow_history_data_agent:/ragflow/history_data_agent
      - /second_disk/docker_data/ragflow/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - /second_disk/docker_data/ragflow/entrypoint.sh:/ragflow/entrypoint.sh
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE}
    networks:
      - ragflow_langfuse
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ragflow-ingestion:
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragflow-ingestion
    entrypoint: ["/ragflow/entrypoint.sh", "--disable-webserver", "--workers=2", "--host-id=ingestion"]
    ports:
      - 5678:5678
      - 5679:5679
    volumes:
      - /second_disk/docker_data/ragflow/ragflow-logs/ingestion:/ragflow/logs
      - /second_disk/docker_data/ragflow/ragflow_history_data_agent:/ragflow/history_data_agent
      - /second_disk/docker_data/ragflow/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - /second_disk/docker_data/ragflow/entrypoint.sh:/ragflow/entrypoint.sh
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE}
    networks:
      - ragflow_langfuse
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          memory: 2G
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ragflow_langfuse: